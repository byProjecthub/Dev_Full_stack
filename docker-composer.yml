services:
  app:
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./:/app
      # Keep the image's locked dependencies when mounting the source checkout.
      - /app/vendor
    environment:
      MYSQLHOST: db
      MYSQLPORT: "3306"
      MYSQLDATABASE: ${MYSQLDATABASE:-vueports_database}
      MYSQLUSER: ${MYSQLUSER:-vueports}
      MYSQLPASSWORD: ${MYSQLPASSWORD:?Set MYSQLPASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      COMPOSER_HOME: /tmp/composer
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$h=json_decode(file_get_contents('http://127.0.0.1:8080/monitoring/health-check.php'), true); exit(($$h['status'] ?? '') === 'healthy' ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 24

  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    command: ["--lower-case-table-names=1", "--skip-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQLDATABASE:-vueports_database}
      MYSQL_USER: ${MYSQLUSER:-vueports}
      MYSQL_PASSWORD: ${MYSQLPASSWORD:?Set MYSQLPASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles: ["extras"]

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    profiles: ["extras"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
