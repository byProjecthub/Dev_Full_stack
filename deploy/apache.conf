ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /app
    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /app>
        Require all granted
        AllowOverride None
        Options -Indexes -Includes -ExecCGI
        RewriteEngine On
        RewriteRule "(^|/)\." - [F,L]
        RewriteRule "^(config|includes|vendor|tests|scripts|cron|conf\.d|logs|cache|sessions)(/|$)" - [F,L,NC]
        RewriteRule "\.(sql|ini|log|pdf|ya?ml|lock|json)$" - [F,L,NC]
        RewriteRule "^(Dockerfile.*|import-db\.php|test-email\.php|process-email-queue\.php)$" - [F,L,NC]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    <DirectoryMatch "^/app/(config|includes|vendor|tests|scripts|cron|conf\.d|logs|cache|sessions)(/|$)">
        Require all denied
    </DirectoryMatch>

    <Directory /app/uploads>
        AllowOverride None
        Options -Indexes -Includes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
