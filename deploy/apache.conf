ServerTokens Prod
ServerSignature Off
ServerName localhost
SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(config|includes|vendor|database|scripts|cron|conf\.d|sessions|logs|cache|backups|websocket|deploy|tests|docs)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/uploads>
    AllowOverride None
    Options -Indexes -Includes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
