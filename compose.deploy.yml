name: vueports
services:
  app:
    image: ghcr.io/${GHCR_OWNER:-byprojecthub}/${GHCR_REPOSITORY:-dev_full_stack}:${IMAGE_TAG:?Set IMAGE_TAG to a published sha-commit tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your pooled Neon URI}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Set DATABASE_URL_UNPOOLED to your direct Neon URI}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET on the deployment host}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      SESSION_SECURE: ${SESSION_SECURE:-1}
      SESSION_DRIVER: database
      SESSION_SAMESITE: Lax
    volumes:
      - uploads:/var/www/html/uploads
      - runtime:/tmp/vueports
volumes:
  uploads:
  runtime:
